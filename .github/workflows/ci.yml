name: Validate assistant
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pytest==9.1.1 ruff==0.16.8 pip-audit==2.10.1
      - run: ruff check .
      - run: pytest -q
      - run: pip-audit -r requirements.lock --disable-pip --no-deps
      - run: docker build -t retail-agent-sandbox:local .
      - run: python -m scripts.smoke_sandbox
